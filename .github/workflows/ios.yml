name: ios

# The iPhone/iPad build of xnav.k, unsigned: SideStore or AltStore signs it
# with her free Apple ID on install, so no certificate lives here.
#
# Only a push to the ios branch builds (GitHub only offers the by-hand button
# for workflows on the default branch, which this one is not), and a newer
# push cancels the run before it. The repo is public, so the Macs are free.
#
# Two Macs per push. One makes the IPA she installs. The other builds the same
# app for the iPhone simulator, opens it at Oakland City Hall, and publishes a
# screenshot and the app's console, so a crash on launch shows up here and not
# on her phone. It also rides up Broadway on a route, for the router, the
# turn-by-turn and the voice. The simulator one is an Apple Silicon Mac because Compose ships
# no Intel simulator build.
on:
  push:
    branches: [ios]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write     # the release the IPA and the screenshot are published to

jobs:
  ipa:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: device
            runner: macos-15-intel
          - kind: simulator
            runner: macos-15
    name: ${{ matrix.kind }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # The iOS plugins and Compose call iOS 26 APIs; the image's default
      # Xcode is older. The newest one it has, not a named one, so an image
      # update needs no edit here.
      - name: Use the newest Xcode
        run: |
          x="$(python3 -c 'import glob, re; print(max(glob.glob("/Applications/Xcode_[0-9]*.app"), key=lambda p: [int(n) for n in re.findall(r"\d+", p)]))')"
          sudo xcode-select -s "$x"
          xcodebuild -version

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Kotlin/Native downloads its toolchain (~1 GB) on first use; kept
      # between runs so a rebuild does not pay for it again.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}

      # Her map and her voice ride inside the app, and neither is in git: the
      # same files her phone downloads from the site, checked against the
      # pack's own MANIFEST before anything is built on them.
      - name: Fetch the map pack and the voice
        run: |
          set -euo pipefail
          mkdir -p iosApp/Resources/data iosApp/Resources/voice "$RUNNER_TEMP/pack"
          curl -fsSL -o "$RUNNER_TEMP/bayarea.navipack" https://xnav.alola.lol/bayarea.navipack
          curl -fsSL -o "$RUNNER_TEMP/voice.zip" https://xnav.alola.lol/arnold.voicepack.zip
          unzip -q "$RUNNER_TEMP/bayarea.navipack" -d "$RUNNER_TEMP/pack"
          python3 - "$RUNNER_TEMP/pack" iosApp/Resources/data <<'PY'
          import hashlib, os, shutil, sys
          src, dst = sys.argv[1], sys.argv[2]
          for line in open(os.path.join(src, "MANIFEST")):
              parts = line.rstrip("\n").split("\t")
              if len(parts) != 3:
                  continue
              name, size, sha = parts
              path = os.path.join(src, name)
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for block in iter(lambda: f.read(1 << 20), b""):
                      h.update(block)
              if os.path.getsize(path) != int(size) or h.hexdigest() != sha:
                  sys.exit(f"{name}: not the file the MANIFEST names")
              shutil.move(path, os.path.join(dst, name))
              print(f"ok {name} {size}")
          PY
          unzip -q -j "$RUNNER_TEMP/voice.zip" -d iosApp/Resources/voice
          echo "voice: $(ls iosApp/Resources/voice | wc -l) clips"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      # The Xcode build runs Gradle itself (a build phase in project.yml) to
      # make XnavKit.framework, so this one command builds both halves. The
      # whole log is kept: Kotlin's errors come out long before the end, so
      # a failure prints every error line first, then the tail.
      - name: Archive, unsigned
        if: matrix.kind == 'device'
        run: |
          log="$RUNNER_TEMP/xcodebuild.log"
          xcodebuild archive \
            -project iosApp/Xnav.xcodeproj -scheme Xnav -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Xnav.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$log" 2>&1 && { tail -40 "$log"; exit 0; }
          echo "::group::every error line"
          grep -nE '(^| )(e|error): |error:|FAILED|What went wrong|Could not resolve|Unresolved reference' "$log" | head -300
          echo "::endgroup::"
          tail -150 "$log"
          exit 1

      # An .ipa is a zip with the app under Payload/. Opened again and checked
      # for the Payload and its Info.plist, so a green run means a file that
      # installs, not one that merely exists.
      - name: Package the IPA
        if: matrix.kind == 'device'
        run: |
          set -euo pipefail
          app="$(find "$RUNNER_TEMP/Xnav.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' | head -1)"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          # Self-signed (ad hoc): archived with signing off, the app is bare,
          # and an installer on her phone refused that as "not signed at
          # all" (2026-10-22). Frameworks first, then the app around them.
          a="$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          if [ -d "$a/Frameworks" ]; then
            find "$a/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign --force --sign - --timestamp=none {} \;
          fi
          codesign --force --sign - --timestamp=none "$a"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$RUNNER_TEMP/xnav-k.ipa" Payload)
          python3 - "$RUNNER_TEMP/xnav-k.ipa" <<'PY'
          import os, sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          if not [n for n in names if n.startswith("Payload/") and n.endswith(".app/Info.plist") and n.count("/") == 2]:
              sys.exit("no app Info.plist under Payload/")
          if not [n for n in names if n.count("/") == 3 and n.endswith(".app/_CodeSignature/CodeResources")]:
              sys.exit("the app is not signed")
          print(f"ok: {os.path.getsize(sys.argv[1]):,} bytes, {len(names)} entries")
          PY

      # Onto a release, not an Actions artifact: the account's artifact
      # storage is full, and release assets do not count against it.
      - name: Publish the IPA
        if: matrix.kind == 'device'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ios-${GITHUB_REF_NAME}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "xnav.k for iPhone and iPad ($GITHUB_REF_NAME)" \
            --notes "Unsigned; SideStore or AltStore signs it on install." \
            || gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$RUNNER_TEMP/xnav-k.ipa"

      # Debug, for readable crash reports. The simulator build is unsigned
      # like the device one, then signed ad hoc ("-") so the simulator will run
      # it: on Apple Silicon nothing launches without at least that.
      - name: Build for the simulator
        if: matrix.kind == 'simulator'
        run: |
          log="$RUNNER_TEMP/xcodebuild.log"
          xcodebuild build \
            -project iosApp/Xnav.xcodeproj -scheme Xnav -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$log" 2>&1 && { tail -20 "$log"; exit 0; }
          echo "::group::every error line"
          grep -nE '(^| )(e|error): |error:|FAILED|What went wrong|Could not resolve|Unresolved reference' "$log" | head -300
          echo "::endgroup::"
          tail -150 "$log"
          exit 1

      # Opened where she lives, with location already allowed, then left for
      # 45 s: long enough for the map, the places search and the router to load.
      # A crash, or an app that is no longer running at the end, fails the job.
      - name: Open it in the simulator
        if: matrix.kind == 'simulator'
        run: |
          set -uo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Xnav.app"
          id=online.iamprettyfamous.agedashii.navikt
          out="$RUNNER_TEMP/sim"; mkdir -p "$out"
          find "$app/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) -exec codesign -f -s - {} \; 2>/dev/null
          codesign -f -s - "$app"
          udid="$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          d = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in d if "iOS" in k), key=lambda k: [int(n) for n in re.findall(r"\d+", k)])
          for k in reversed(ios):
              phones = [x for x in d[k] if x["name"].startswith("iPhone")]
              if phones:
                  print(phones[-1]["udid"]); break
          ')"
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          xcrun simctl install "$udid" "$app"
          xcrun simctl privacy "$udid" grant location-always "$id" || xcrun simctl privacy "$udid" grant location "$id"
          # A ride: parked at City Hall while the route to Grand Avenue by the
          # lake is worked out (up Broadway, then turns, so the voice has turns
          # to call), then along that route's own line at 25 mph, one fix a
          # second, as a GPS gives them. Screens at 40, 90 and 180 s in.
          xcrun simctl location "$udid" set 37.8044,-122.2712
          SIMCTL_CHILD_XNAV_SMOKE_DEST=37.8112,-122.2624 \
            xcrun simctl launch --console-pty --terminate-running-process "$udid" "$id" > "$out/console.txt" 2>&1 &
          for i in $(seq 60); do grep -q '^\[smoke-route\]' "$out/console.txt" && break; sleep 1; done
          grep -m1 '^\[smoke-route\]' "$out/console.txt" | python3 -c '
          import math, sys
          line = sys.stdin.read().split(" ", 1)[1].strip()
          pts = [tuple(map(float, p.split(","))) for p in line.split(";")]
          def metres(a, b):
              return math.hypot((b[0] - a[0]) * 111320, (b[1] - a[1]) * 111320 * math.cos(math.radians(a[0])))
          step, left = 11.2, 0.0
          print("%.6f,%.6f" % pts[0])
          for a, b in zip(pts, pts[1:]):
              d = metres(a, b)
              while left + d >= step:
                  f = (step - left) / d
                  a = (a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f)
                  d -= step - left
                  left = 0.0
                  print("%.6f,%.6f" % a)
              left += d
          ' > "$RUNNER_TEMP/ride.txt" || echo "no route line from the app"
          echo "ride: $(wc -l < "$RUNNER_TEMP/ride.txt") fixes"
          # simctl takes most of a second itself, so the clock, not a sleep,
          # keeps the fixes a second apart.
          python3 -c '
          import subprocess, sys, time
          t = time.monotonic()
          for ll in open(sys.argv[2]).read().split():
              subprocess.run(["xcrun", "simctl", "location", sys.argv[1], "set", ll])
              t += 1.0
              time.sleep(max(0.0, t - time.monotonic()))
          ' "$udid" "$RUNNER_TEMP/ride.txt" &
          sleep 40; xcrun simctl io "$udid" screenshot "$out/screen-40s.png"
          sleep 50; xcrun simctl io "$udid" screenshot "$out/screen-90s.png"
          sleep 90; xcrun simctl io "$udid" screenshot "$out/screen-180s.png"
          running=no
          xcrun simctl spawn "$udid" launchctl list | grep -q "$id" && running=yes
          for f in ~/Library/Logs/DiagnosticReports/Xnav*; do [ -e "$f" ] && cp "$f" "$out/"; done
          echo "still running after the ride: $running"
          echo "::group::console (last 200 lines)"; tail -200 "$out/console.txt"; echo "::endgroup::"
          ls "$out"
          [ "$running" = yes ]

      - name: Publish the screenshot and the console
        if: always() && matrix.kind == 'simulator'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/sim"
          [ -d "$out" ] || exit 0
          tag="ios-${GITHUB_REF_NAME}"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --prerelease \
            --target "$GITHUB_SHA" --title "xnav.k for iPhone and iPad ($GITHUB_REF_NAME)" \
            --notes "Unsigned; SideStore or AltStore signs it on install." \
            || gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null
          cd "$out" && for f in *; do cp "$f" "sim-$f"; gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "sim-$f"; done
