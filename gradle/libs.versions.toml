# Every version here was read from Maven Central / Google Maven on 2026-09-27,
# not guessed. AGP 9.4 needs Gradle >= 9.6.0, JDK 17 and build-tools 36.0.0
# (AGP 9.4.0 release notes, "Compatibility").
[versions]
agp = "9.4.1"
kotlin = "2.4.20"
compose-bom = "2026.09.00"
activity-compose = "1.13.0"
core-ktx = "1.19.1"
coroutines = "1.11.0"
serialization-json = "1.11.0"
junit-bom = "6.1.3"
# 13.6.1 is the highest stable. 13.5.2 was published later but is a backport.
maplibre = "13.6.1"
# Valhalla 3.6.3 inside. The routing tiles are built with that exact version,
# so do NOT bump this without telling whoever builds the tiles (minion 5).
valhalla-mobile = "0.6.3"
# The Valhalla tag valhalla-mobile pins (its src/valhalla submodule); the routing
# tiles MUST be built with it. Not a dependency - :core's TileVersionGuardTest
# asserts this equals VALHALLA_TILES. The 0.6.3 -> 3.6.3 mapping was read from
# the GitHub API by hand; bumping the binding means re-reading it.
valhalla = "3.6.3"
# Test only: screenshots of the dash on the JVM. Read from Maven Central
# maven-metadata.xml <release> on 2026-09-27 (roborazzi and its plugin marker
# 1.75.0, published 2026-09-21; robolectric 4.17, 2026-09-10; junit 4.13.2,
# which Robolectric's runner needs).
roborazzi = "1.75.0"
robolectric = "4.17"
okio = "3.18.2"
kotlinx-datetime = "0.8.0"
compose-multiplatform = "1.12.1"
junit4 = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-ui = { module = "androidx.compose.ui:ui" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
cmp-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
cmp-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
cmp-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
maplibre-android = { module = "org.maplibre.gl:android-sdk", version.ref = "maplibre" }
valhalla-mobile = { module = "io.github.rallista:valhalla-mobile", version.ref = "valhalla-mobile" }
# valhalla-mobile's POM declares its config models runtime-only, but its public
# API (ValhallaConfigFactory, the Valhalla constructor) exposes them: without
# this the app cannot compile against it. 0.5.2 is the version its POM pins.
valhalla-models-config = { module = "io.github.rallista:valhalla-models-config", version = "0.5.2" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit-bom" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# test only
# The places list's search is tested against the real places.sqlite through
# JDBC (the app uses Android's SQLite). Apache-2.0; 3.53.4.0 is Maven Central's
# release as of 2026-09-28.
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.4.0" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
# The iPhone build: okio and kotlinx-datetime stand in for java.io and
# java.time, so :core compiles for iOS as well as the JVM.
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }
